services:
  web_creator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_creator
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATA_DIR: /data/paginas_geradas
      DEFAULT_WEBHOOK_URL: ${DEFAULT_WEBHOOK_URL:-http://seu-webhook:porta/webhook/generate_page}
    volumes:
      - ./data:/data
    restart: unless-stopped